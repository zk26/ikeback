name: ikeback Release

# Publishes THREE real, compiled artifacts on tag push / manual dispatch:
#   - Android APK                 (Ubuntu + JDK21 + Android SDK)
#   - Windows teacher setup EXE   (MSYS2 UCRT64 + Qt6/MinGW)
#   - Windows student setup EXE   (same binaries, different role preset)
# plus SHA256SUMS.txt and RELEASE-NOTES.md.
#
# Must live at the REPOSITORY ROOT .github/workflows/ to be triggered.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v prefix (e.g. 5.3.1)'
        required: true
        default: '5.3.1'
      purge_old_releases:
        description: 'After publishing, delete every GitHub release older than 5.2.0'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    name: Resolve canonical release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      name: ${{ steps.resolve.outputs.name }}
      code: ${{ steps.resolve.outputs.code }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - id: resolve
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          text = Path('mobile/app/build.gradle.kts').read_text(encoding='utf-8')
          name = re.search(r'versionName\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"', text)
          code = re.search(r'versionCode\s*=\s*(\d+)', text)
          if not name or not code:
              raise SystemExit('Cannot read canonical Android version from mobile/app/build.gradle.kts')
          version = name.group(1)
          requested = os.environ.get('REQUESTED_VERSION', '').strip()
          tag = os.environ.get('TAG_NAME', '').strip()
          if requested and requested != version:
              raise SystemExit(f'Requested version {requested} does not match canonical Android version {version}')
          if tag and tag != f'v{version}':
              raise SystemExit(f'Tag {tag} does not match canonical Android version v{version}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'name={version}\ncode={code.group(1)}\n')
          PY

  # ------------------------------------------------------------------ Android
  android:
    name: Android classroom app
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # Fail before spending time on Gradle if release signing is not configured.
      - name: Validate and decode Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/ikeback-release.jks
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required Android signing secret $name is missing"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          test -s "$ANDROID_KEYSTORE_FILE"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'

      # Reuse the Gradle dependency cache between release runs.
      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile/**/*.gradle.kts', 'mobile/gradle/libs.versions.toml', 'mobile/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ubuntu runners ship an Android SDK; setup-android@v3 replaces its
      # cmdline-tools with an older pinned version and fails on licenses.
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Build and test
        working-directory: mobile
        env:
          IKEBACK_REQUIRE_RELEASE_SIGNING: '1'
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/ikeback-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:testDebugUnitTest --no-daemon

      - name: Remove signing key from runner
        if: always()
        shell: bash
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/ikeback-release.jks
        run: rm -f "$ANDROID_KEYSTORE_FILE"

      - name: Collect APK
        shell: bash
        env:
          VERSION_NAME: ${{ needs.version.outputs.name }}
          VERSION_CODE: ${{ needs.version.outputs.code }}
        run: |
          set -euo pipefail
          APK=$(find mobile/app/build/outputs -name '*release*.apk' -type f | head -n 1)
          test -n "$APK" || { echo 'No release APK produced'; exit 1; }
          mkdir -p dist
          cp "$APK" dist/ikeback-Mobile.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          AAPT2="$BUILD_TOOLS/aapt2"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          # The published APK must be signed, non-debuggable and match the canonical release.
          "$APKSIGNER" verify --verbose --print-certs dist/ikeback-Mobile.apk
          BADGING=$("$AAPT2" dump badging dist/ikeback-Mobile.apk)
          grep -q "^package: name='top.ikee002.ikeback' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" <<< "$BADGING" || {
            echo "::error::APK package/version does not match top.ikee002.ikeback $VERSION_NAME ($VERSION_CODE)"; exit 1;
          }
          if grep -q '^application-debuggable' <<< "$BADGING"; then
            echo '::error::Release APK is debuggable'; exit 1
          fi

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ikeback-android
          path: dist/ikeback-Mobile.apk
          if-no-files-found: error

  # ------------------------------------------------------------------ Windows
  windows:
    name: Windows binaries (UCRT64 / Qt6 / MinGW)
    needs: version
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            base-devel
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-5compat
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-httpserver
            mingw-w64-ucrt-x86_64-qt6-websockets
            mingw-w64-ucrt-x86_64-qt6-translations
            mingw-w64-ucrt-x86_64-qca-qt6
            mingw-w64-ucrt-x86_64-libvncserver
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-libsodium
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-lzo2
            mingw-w64-ucrt-x86_64-openldap
            mingw-w64-ucrt-x86_64-cyrus-sasl
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-python

      # Restored trees are already patched (the cache is saved at job end);
      # every patch below is idempotent so re-patching is safe.
      - name: Cache Veyon 3rdparty sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: desktop/3rdparty
          key: veyon-3rdparty-win-v4.11.4-30860286-479a32b-2002b2c-f80feff-7ad8859

      - name: Fetch Veyon 3rdparty sources (pinned to v4.11.4)
        shell: bash
        run: |
          set -e
          base=desktop/3rdparty
          mkdir -p "$base"
          fetch() {
            name=$1; url=$2; sha=$3
            if [ -d "$base/$name/.git" ]; then return 0; fi
            git init -q "$base/$name"
            git -C "$base/$name" remote add origin "$url"
            git -C "$base/$name" fetch -q --depth 1 origin "$sha" \
              || git -C "$base/$name" fetch -q origin "$sha"
            git -C "$base/$name" checkout -q FETCH_HEAD
          }
          fetch libvncserver https://github.com/veyon/libvncserver.git 30860286c0f55674a846df9cab458da9afd1735b
          fetch ultravnc     https://github.com/veyon/ultravnc.git      479a32b8d7f929b6a0eb5730a678f3c812c8be0a
          fetch kldap        https://invent.kde.org/pim/kldap.git      2002b2c4ec81d05eb0fc5b2106ef112d404f5cea
          fetch qthttpserver https://github.com/veyon/qthttpserver.git  f80feff79a3d698ca3f23cfa240bd763d87cf0ba
          fetch libfakekey   https://github.com/veyon/libfakekey.git    7ad885912efb2131e80914e964d5e635b0d07b40

      # The pinned UltraVNC tree no longer compiles with a current GCC/MinGW
      # toolchain: VNCLOG() concatenates __FUNCTION__ (now a pointer), the TCHAR
      # based accessors break under UNICODE, and two helpers live in translators
      # that are not part of the windows-platform target. Patch the tree once,
      # here, instead of forking the third-party sources. Keep this step in sync
      # with ikeback-windows.yml.
      - name: Patch pinned UltraVNC sources for the current toolchain
        shell: bash
        run: |
          set -e
          # VNCLOG() concatenates __FUNCTION__ (a pointer with current GCC) and
          # several UltraVNC files define their own copy, so rewrite them all.
          find desktop/3rdparty/ultravnc/winvnc -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.c' \) \
            -exec perl -0pi -e 's/#define\s+VNCLOG\(s\)[^\n]*/#define VNCLOG(s) (s)/g' {} + || true
          # vncEncodeZlibHex.h includes <lzo/minilzo.h>, which ships in the pinned
          # UltraVNC tree as lzo.orig/. Make it reachable as lzo/. The rm keeps
          # this step idempotent when the 3rdparty cache is restored.
          rm -rf desktop/3rdparty/ultravnc/lzo
          cp -r desktop/3rdparty/ultravnc/lzo.orig desktop/3rdparty/ultravnc/lzo
          # MS-Logon / DSM / keepalive / file-transfer paths are cut at the
          # source level: the plugin defines ULTRAVNC_VEYON_SUPPORT (the exact
          # macro set of the upstream v4.11.4 build), so no patching for
          # m_ms_logon / AuthMsLogon / m_pref_* is needed anymore.
          grep -rn 'define VNCLOG' desktop/3rdparty/ultravnc/winvnc/ | head -8 || true
          # GWL_* accessors are only declared for WINVER < 0x0500; rewrite them.
          find desktop/3rdparty/ultravnc -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.c' \) \
            -exec perl -pi -e 's/\bGWL_WNDPROC\b/GWLP_WNDPROC/g; s/\bGWL_HINSTANCE\b/GWLP_HINSTANCE/g; s/\bGWL_ID\b/GWLP_ID/g; s/\bGWL_USERDATA\b/GWLP_USERDATA/g; s/DWL_MSGRESULT/DWLP_MSGRESULT/g; s/DWL_DLGPROC/DWLP_DLGPROC/g; s/DWL_USER/DWLP_USER/g' {} + || true
          # The pinned tree's ULTRAVNC_VEYON_SUPPORT code path (active in
          # inifile.cpp / vncOSVersion.cpp) calls ultravnc_veyon_load_int and
          # ultravnc_veyon_load_password, but BuiltinUltraVncServer.cpp renamed
          # those shims to ultravnc_ikeback_load_*. Without this rewrite the
          # builtin-ultravnc-server link dies with undefined references.
          find desktop/3rdparty/ultravnc -type f \( -name '*.cpp' -o -name '*.h' -o -name '*.c' \) \
            -exec perl -pi -e 's/ultravnc_veyon_load/ultravnc_ikeback_load/g' {} + || true
          k=desktop/3rdparty/ultravnc/winvnc/winvnc/vnckeymap.cpp
          grep -q '#undef UNICODE' "$k" || sed -i '1i #undef UNICODE\n#undef _UNICODE' "$k"
          perl -0pi -e 's/vnclog\.Print\([^;]*\);/(void)0;/gs' "$k"
          perl -0pi -e 's/settings->RunningFromExternalService\(\)/false/gs' "$k"
          grep -c 'vnclog\.Print\|RunningFromExternalService' "$k" || true
          head -3 "$k"

      - name: Configure
        shell: msys2 {0}
        run: |
          set -o pipefail
          cmake -S desktop -B build -G Ninja \
            -DCMAKE_PREFIX_PATH=/ucrt64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DWITH_QT6=ON -DWITH_BUNDLED_LIBVNC=ON \
            -DWITH_WEBAPI=OFF -DWITH_TRANSLATIONS=OFF \
            -DWITH_LTO=OFF -DWITH_PCH=OFF -DWITH_UNITY_BUILD=OFF \
            -DWITH_STACK_PROTECTION=OFF -DWITH_TESTS=OFF -DWITH_CORE_ONLY=OFF \
            -DCMAKE_SKIP_INSTALL_RULES=ON \
            -DCMAKE_CXX_FLAGS="-include cmath" 2>&1 | tee configure.log

      - name: Build plugin and Ikeback executables
        shell: msys2 {0}
        run: |
          set -o pipefail
          cmake --build build --parallel "$(nproc)" --target \
            classroom \
            ikeback-master ikeback-configurator ikeback-cli ikeback-wcli \
            ikeback-service ikeback-server ikeback-worker 2>&1 | tee build.log

      # MANDATORY: without `windows-platform.dll` IkebackCore qFatal()s and every
      # Ikeback executable dies with __fastfail at startup.
      - name: Build mandatory Windows platform plugin
        shell: msys2 {0}
        run: |
          set -o pipefail
          if cmake --build build --parallel "$(nproc)" --target windows-platform > windows-platform.log 2>&1; then
            cat windows-platform.log
            exit 0
          fi
          cat windows-platform.log
          grep -E "error:|undefined reference" windows-platform.log | head -9 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 1

      - name: Build other upstream plugins (best effort)
        shell: msys2 {0}
        run: |
          set -o pipefail
          # `builtin-ultravnc-server` is the real target name (the directory is
          # called ultravnc-builtin). Without this plugin ikeback-server exits
          # with "no VNC server plugins found" and nothing can connect.
          for target in authkeys builtindirectory demo desktopservices ldap \
                        powercontrol remoteaccess screenlock screenshot \
                        systemusergroups textmessage usersessioncontrol \
                        external-vnc-server headless-vnc-server \
                        builtin-ultravnc-server vnchooks; do
            if cmake --build build --parallel "$(nproc)" --target "$target" > /tmp/plugin-one.log 2>&1; then
              echo "built:   $target"
            else
              echo "skipped: $target"
              tail -n 12 /tmp/plugin-one.log || true
              if [ "$target" = "builtin-ultravnc-server" ]; then
                echo "::error::the VNC server plugin failed to build - ikeback-server cannot start without it"
                tail -n 8 /tmp/plugin-one.log | while IFS= read -r line; do echo "::error::vs|${line}"; done
                exit 1
              fi
            fi
          done

      # A hand-written DLL whitelist produced installs that failed with
      # "libbz2-1.dll / libmd4c.dll not found". ntldd now walks the real PE
      # import closure so every required runtime DLL is shipped.
      # Compile the .ts sources into .qm so the installed UI is Chinese by
      # default (switchable in Configurator -> General -> Language).
      - name: Build Simplified Chinese translations
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p translations
          LRELEASE="$(command -v lrelease || command -v lrelease-qt6 || true)"
          if [ -z "$LRELEASE" ]; then
            LRELEASE="$(find /ucrt64/bin -maxdepth 1 -name 'lrelease*' -type f 2>/dev/null | head -n 1)"
          fi
          if [ -z "$LRELEASE" ]; then echo 'lrelease not found' >&2; exit 1; fi
          "$LRELEASE" desktop/translations/ikeback_zh_CN.ts -qm translations/ikeback_zh_CN.qm
          find /ucrt64/share/qt6/translations -maxdepth 1 -name 'qt*_zh_CN.qm' -exec cp '{}' translations/ \; 2>/dev/null || true
          ls -lh translations

      - name: Assemble self-contained runtime payload
        shell: msys2 {0}
        run: bash desktop/scripts/collect-windows-runtime.sh

      - name: Build teacher and student setup EXEs
        shell: msys2 {0}
        run: |
          set -e
          mkdir -p dist
          { printf '\xEF\xBB\xBF'; cat desktop/scripts/ikeback-installer.nsi; } > installer.nsi
          makensis -DVERSION='${{ needs.version.outputs.name }}' -DROLE=teacher installer.nsi
          makensis -DVERSION='${{ needs.version.outputs.name }}' -DROLE=student installer.nsi
          ls -lh dist

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ikeback-windows
          path: dist/*.exe
          if-no-files-found: error

  # ------------------------------------------------------------------ Package
  package:
    name: Assemble release artifacts
    needs: [version, android, windows]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: ikeback-android
          path: artifacts

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: ikeback-windows
          path: windows-setups

      - name: Assemble the three artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = '${{ needs.version.outputs.name }}'
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $apk = Get-ChildItem -LiteralPath 'artifacts' -Filter '*.apk' -File | Select-Object -First 1
          if (-not $apk) { throw 'Android APK artifact missing' }
          Copy-Item -LiteralPath $apk.FullName -Destination "dist/ikeback-Mobile-$v.apk" -Force

          $setups = @(Get-ChildItem -LiteralPath 'windows-setups' -Filter '*-setup.exe' -File)
          if ($setups.Count -ne 2) { throw "Expected 2 setup EXEs, got $($setups.Count)" }
          foreach ($setup in $setups) {
            Copy-Item -LiteralPath $setup.FullName -Destination "dist/$($setup.Name)" -Force
          }

          $lines = Get-ChildItem -LiteralPath 'dist' -File |
            Where-Object { $_.Name -like 'ikeback-*' } |
            Sort-Object Name |
            ForEach-Object {
              ((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()) + '  ' + $_.Name
            }
          [IO.File]::WriteAllLines('dist/SHA256SUMS.txt', $lines, (New-Object Text.UTF8Encoding($false)))
          Get-ChildItem -LiteralPath 'dist' -File |
            Select-Object Name, @{N='MB';E={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize

      - name: Write release notes
        shell: pwsh
        run: |
          $v = '${{ needs.version.outputs.name }}'
          $code = '${{ needs.version.outputs.code }}'
          $template = [IO.File]::ReadAllText('desktop/scripts/release-notes-template.md', [Text.Encoding]::UTF8)
          $notes = $template.Replace('{VER}', $v).Replace('{CODE}', $code)
          [IO.File]::WriteAllText('dist/RELEASE-NOTES.md', $notes, (New-Object Text.UTF8Encoding($false)))

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ikeback-release-final
          path: dist/*
          if-no-files-found: error

  # ------------------------------------------------------------------ Release
  release:
    name: Publish GitHub Release
    needs: [version, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: ikeback-release-final
          path: dist

      - name: Verify all three artifacts and checksums
        shell: bash
        run: |
          set -e
          ls dist/ikeback-teacher-*-win64-setup.exe
          ls dist/ikeback-student-*-win64-setup.exe
          ls dist/ikeback-Mobile-*.apk
          ls dist/SHA256SUMS.txt
          cd dist
          while read -r hash file; do
            [ -z "$file" ] && continue
            echo "$hash  $file" | sha256sum -c -
          done < SHA256SUMS.txt

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v${{ needs.version.outputs.name }}
          name: ikeback v${{ needs.version.outputs.name }}
          body_path: dist/RELEASE-NOTES.md
          files: |
            dist/ikeback-teacher-*-win64-setup.exe
            dist/ikeback-student-*-win64-setup.exe
            dist/ikeback-Mobile-*.apk
            dist/SHA256SUMS.txt
            dist/RELEASE-NOTES.md
          fail_on_unmatched_files: true

      # 5.2.0 is the first official ikeback release. Opt-in so a normal publish
      # never deletes anything by accident - tick "purge_old_releases" when
      # dispatching the workflow.
      - name: Purge releases older than 5.2.0
        if: github.event.inputs.purge_old_releases == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $cutoff = [version]'5.2.0'
          $tags = gh release list --limit 200 --json tagName --jq '.[].tagName'
          foreach ($tag in $tags) {
            if ([string]::IsNullOrWhiteSpace($tag)) { continue }
            $clean = ($tag -replace '^v', '') -replace '[-+].*$', ''
            if ($clean -notmatch '^\d+(\.\d+){1,3}$') {
              Write-Host "skip $tag (not a numeric version)"
              continue
            }
            if ([version]$clean -lt $cutoff) {
              Write-Host "deleting release $tag"
              gh release delete $tag --cleanup-tag --yes
            } else {
              Write-Host "keep $tag"
            }
          }
